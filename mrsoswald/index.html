<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a2a"><meta name="description" content="Step inside Mrs Oswald’s Classroom. Something wonderful is brewing. Website under construction.">
<title>Mrs Oswald’s Classroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E⚗️%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d1c1c;color:#fff8db}body{height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at center,#24413b 0%,#0c1919 78%)}
header{text-align:center;padding:16px 16px 12px;z-index:1}h1{font-size:clamp(23px,2.6vw,38px);font-weight:500;line-height:1.12;letter-spacing:-.025em;margin:0}h1 span{font-style:italic;color:#e6d7af;font-size:.8em;margin-left:.28em}
.viewport{min-width:0;min-height:0;width:100%;display:grid;place-items:center;overflow:hidden}.scene{position:relative;width:var(--scene-width,100%);aspect-ratio:3/2;isolation:isolate;box-shadow:0 12px 48px #0004}.scene img,.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.scene img{object-fit:contain}.scene canvas{pointer-events:none}
footer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));font:10px/1.4 Arial,sans-serif;color:#d8dac7}
.tape{position:relative;width:190px;max-width:55vw;color:#d9c381;background:#aa8c3920;border:1px solid #ad945f55;border-radius:3px;overflow:hidden;pointer-events:none}.tape:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(135deg,#bfa357 0 4px,#373a26 4px 8px)}.tape-inner{text-align:center;white-space:nowrap;padding:7px 9px 7px 15px;font:600 9px/1.4 Arial,sans-serif;letter-spacing:.12em}
button{color:#d9dece;background:transparent;border:1px solid #d5e5d72e;border-radius:22px;padding:9px 13px;font:10px/1.4 Arial,sans-serif;letter-spacing:.04em;cursor:pointer}button:hover{background:#ffffff0d}button:focus-visible{outline:3px solid #ffe37c;outline-offset:3px}
@media(max-width:520px){header{padding-top:max(18px,env(safe-area-inset-top));padding-bottom:12px}h1{font-size:26px}h1 span{display:block;margin:4px 0 0;font-size:21px}.tape{width:173px}.tape-inner{font-size:8px}footer{gap:8px}}@media(max-height:480px){header{padding:6px 12px}h1{font-size:22px}h1 span{display:inline;margin-left:.3em;font-size:.8em}footer{padding-top:5px;padding-bottom:5px}.tape-inner{padding-top:4px;padding-bottom:4px}button{padding:5px 10px}}
</style>
</head>
<body>
<header><h1>Mrs Oswald’s<span>Classroom</span></h1></header>
<main class="viewport" id="viewport" aria-label="The complete animated science classroom"><div class="scene" id="scene"><img src="assets/classroom.webp" alt="An empty science classroom filled with experiments, glassware, microscopes, models, a glowing green crystal, a steaming beaker, a lit Bunsen burner and a sink full of glassware."><canvas id="effects" width="1536" height="1024" aria-hidden="true"></canvas></div></main>
<footer><div class="tape" aria-label="Under construction"><div class="tape-inner">UNDER CONSTRUCTION</div></div><button id="motion" type="button" aria-pressed="false">Pause motion</button></footer>
<script src="effects.js?v=3"></script>
</body></html>
